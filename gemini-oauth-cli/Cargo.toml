[package]
name = "gemini-oauth-cli"
version = "0.1.0"
edition = "2021"
description = "CLI client for Google Gemini using OAuth (no API key), talking to the Code Assist backend like the official gemini-cli"
license = "MIT"

[[bin]]
name = "gemini"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
open = "5"
futures-util = "0.3"
url = "2"
rand = "0.8"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
